<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>追蹤定位測試</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  #map {
    width: 100%;
    height: 100vh;
  }
  #uiBar {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 10;
    background: white;
    padding: 10px;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  #uiBar button {
    padding: 6px 12px;
    cursor: pointer;
    border: none;
    border-radius: 4px;
    background-color: #1976d2;
    color: white;
  }
</style>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC9yd5GeV-J0SHVtpkeHvtFfSryaavAKIE"></script>
</head>
<body>

<div id="uiBar">
  <button id="locationButton">啟用定位追蹤</button>
</div>

<div id="map"></div>

<script>
let map;
let userMarker = null;
let infoWindow = null;
let watchId = null;

function initMap() {
  // 先隨便顯示一個中心點
  map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: 24.056348, lng: 120.432589 }, // 鹿港中心
    zoom: 15
  });

  infoWindow = new google.maps.InfoWindow();
}

document.getElementById("locationButton").addEventListener("click", () => {
  if (!navigator.geolocation) {
    alert("瀏覽器不支援定位");
    return;
  }

  if (watchId !== null) {
    alert("定位已經啟動");
    return;
  }

  watchId = navigator.geolocation.watchPosition(
    (position) => {
      const pos = {
        lat: position.coords.latitude,
        lng: position.coords.longitude
      };

      if (!userMarker) {
        userMarker = new google.maps.Marker({
          position: pos,
          map: map,
          clickable: false,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 6,
            fillColor: "#ff0000",
            fillOpacity: 1,
            strokeColor: "#ffffff",
            strokeWeight: 2
          }
        });
      } else {
        userMarker.setPosition(pos);
      }

      infoWindow.setPosition(pos);
      infoWindow.setContent(`定位中<br>誤差：${Math.round(position.coords.accuracy)}m`);
      infoWindow.open(map);

      map.panTo(pos);
    },
    (error) => {
      alert("定位失敗：" + error.message);
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 10000
    }
  );
});

window.onload = initMap;
</script>

</body>
</html>
