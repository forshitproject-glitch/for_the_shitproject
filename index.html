<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>具遊戲性質之旅遊網頁</title>

<style>
html, body { margin: 0; padding: 0; }
#app { width: 100%; }
#uiBar {
  padding: 10px;
  background: #ffffff;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
  font-size: 14px;
  position: sticky;
  top: 0;
  z-index: 10;
}
#uiBar button {
  padding: 8px 12px;
  border-radius: 8px;
  border: none;
  margin-right: 6px;
  margin-bottom: 6px;
  cursor: pointer;
  font-weight: bold;
}
.start-btn { background:#2e7d32; color:#fff; }
.stop-btn { background:#d32f2f; color:#fff; }
.cancel-btn { background:#e0e0e0; }
.full-btn { background:#1976d2; color:#fff; }
.finish-btn { background:#d32f2f; color:#fff; }
#timerBox { font-weight: bold; }
#map { width: 100%; height: 420px; min-height: 420px; }
</style>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC9yd5GeV-J0SHVtpkeHvtFfSryaavAKIE&libraries=geometry,routes"></script>
</head>

<body>
<div id="app">
  <div id="uiBar">
    <button id="geoBtn" class="start-btn" onclick="toggleGeolocation()">啟用定位</button>
    <button class="cancel-btn" onclick="skipGeolocation()">不啟用</button>
    <button class="full-btn" onclick="toggleFullscreen()">全螢幕地圖</button>
    <select id="spotSelect" style="padding:6px;border-radius:6px;">
      <option value="">選擇目的地</option>
    </select>+
    <button class="finish-btn" onclick="finishTrip()">完成行程</button>
    <div id="timerBox">時間：<span id="timer">00:00:00</span></div>
    <div id="status">狀態：尚未開始</div>
  </div>
  <div id="map"></div>
</div>

<script>
/* 基本設定 */
const LUKANG_CENTER = { lat:24.056348, lng:120.432589 };
const LUKANG_RADIUS = 4200;

const locations = [
  { name:"玻璃館", lat:24.068667, lng:120.395437 },
  { name:"鹿港老街", lat:24.056348, lng:120.432589 },
  { name:"鹿港龍山寺", lat:24.0504, lng:120.4349 },
  { name:"鹿港天后宮", lat:24.059338, lng:120.43138 },
  { name:"玻璃媽祖廟", lat:24.069118, lng:120.394715 },
  { name:"桂花巷藝術村", lat:24.055848, lng:120.431928 },
  { name:"臺灣玻璃館", lat:24.06897, lng:120.394912 },
  { name:"鹿港民俗文物館", lat:24.0542, lng:120.436306 },
  { name:"九曲巷", lat:24.0535, lng:120.435 },
  { name:"十宜樓", lat:24.0535, lng:120.4353 },
  { name:"鹿港意樓", lat:24.0529, lng:120.4353 },
  { name:"摸乳巷", lat:24.051817, lng:120.432231 }
];

let map, mask, userMarker, accuracyCircle, destinationMarker;
let entered = false;
let timerStart, timerId;
let isFullscreen = false;
let originalHeight = 420;

/* 定位與導航控制變數 */
let autoUpdateInterval = null;
let wakeLock = null;
let userLatLng = null;
let hasFix = false;
let passedRoute = null;     
let remainingRoute = null;  
let lastClosestIndex = 0;   
let uploaded = false;
let finalSeconds = 0;

function setStatus(t){ document.getElementById("status").textContent = "狀態：" + t; }

function circlePath(c,r,p=180){
  const R=6378137, lat=c.lat*Math.PI/180, lng=c.lng*Math.PI/180, d=r/R;
  const a=[];
  for(let i=0;i<p;i++){
    const b=2*Math.PI*i/p;
    const la=Math.asin(Math.sin(lat)*Math.cos(d)+Math.cos(lat)*Math.sin(d)*Math.cos(b));
    const ln=lng+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(lat),Math.cos(d)-Math.sin(lat)*Math.sin(la));
    a.push({lat:la*180/Math.PI,lng:ln*180/Math.PI});
  }
  return a;
}

function initMap(){
  map=new google.maps.Map(document.getElementById("map"),{
    center:LUKANG_CENTER,
    zoom:14,
    mapTypeControl: false
  });

  locations.forEach(l=>{
    const m=new google.maps.Marker({ position:{lat:l.lat,lng:l.lng}, map:map, title:l.name });
    const info=new google.maps.InfoWindow({ content:`<strong>${l.name}</strong>` });
    m.addListener("click",()=>info.open(map,m));
  });

  const outer=[{lat:30,lng:110},{lat:30,lng:140},{lat:10,lng:140},{lat:10,lng:110}];
  const hole=circlePath(LUKANG_CENTER,LUKANG_RADIUS).reverse();
  mask=new google.maps.Polygon({ map, paths:[outer,hole], fillColor:"#000", fillOpacity:0.6, strokeOpacity:0, clickable: false });

  setStatus("進入鹿港後開始計時");
  initSpotSelect();
}

function initSpotSelect() {
  const select = document.getElementById("spotSelect");
  locations.forEach((loc, index) => {
    const opt = document.createElement("option");
    opt.value = index; opt.textContent = loc.name;
    select.appendChild(opt);
  });
  select.addEventListener("change", onSpotSelected);
}

/* --- 改進後的路線選擇函式 --- */
async function onSpotSelected(e) {
  const idx = e.target.value;
  if (idx === "" || !userLatLng) {
    if (!userLatLng) alert("請先點擊『啟用定位』獲取目前位置");
    return;
  }
  if (!hasFix) { alert("正在精確定位中，請稍候..."); return; }

  const dest = locations[idx];
  const { Route } = google.maps;
  const request = {
    origin: userLatLng,
    destination: { lat: dest.lat, lng: dest.lng },
    travelMode: google.maps.TravelMode.WALKING,
    fields: ["path"],
  };

  try {
    const result = await Route.computeRoutes(request);
    const path = result.routes[0].path;
    lastClosestIndex = 0; 
    drawImprovedRoute(path, dest);
  } catch (err) {
    alert("路線計算失敗，可能距離過遠。");
  }
}

function drawImprovedRoute(path, destInfo) {
  if (passedRoute) passedRoute.setMap(null);
  if (remainingRoute) remainingRoute.setMap(null);
  if (destinationMarker) destinationMarker.setMap(null);

  passedRoute = new google.maps.Polyline({
    path: [], map, strokeColor: "#FFFFFF", strokeOpacity: 0.8, strokeWeight: 10, zIndex: 1
  });

  remainingRoute = new google.maps.Polyline({
    path: path, map, strokeColor: "#1A73E8", strokeOpacity: 1, strokeWeight: 6, zIndex: 2
  });

  destinationMarker = new google.maps.Marker({
    position: { lat: destInfo.lat, lng: destInfo.lng },
    map: map,
    label: { text: destInfo.name, color: "white", fontWeight: "bold" },
    animation: google.maps.Animation.DROP
  });

  //  自動縮放視角：讓起點與終點都在畫面上
  const bounds = new google.maps.LatLngBounds();
  bounds.extend(userLatLng);
  bounds.extend({ lat: destInfo.lat, lng: destInfo.lng });
  map.fitBounds(bounds, 50);

  setStatus(`導航至：${destInfo.name}`);
}

/* --- 定位更新邏輯 --- */
async function toggleGeolocation() {
  const btn = document.getElementById("geoBtn");
  if (autoUpdateInterval) {
    clearInterval(autoUpdateInterval); autoUpdateInterval = null;
    releaseWakeLock(); btn.textContent = "啟用定位"; btn.className = "start-btn";
    setStatus("定位已停止");
  } else {
    btn.textContent = "停止定位追蹤"; btn.className = "stop-btn";
    await requestWakeLock();
    performLocationUpdate();
    autoUpdateInterval = setInterval(performLocationUpdate, 5000);
  }
}

function performLocationUpdate() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (p) => {
      const pos = { lat: p.coords.latitude, lng: p.coords.longitude };
      const accuracy = p.coords.accuracy;
      userLatLng = new google.maps.LatLng(pos.lat, pos.lng);
      hasFix = true;

      if (!userMarker) {
        userMarker = new google.maps.Marker({ position: pos, map, zIndex: 999, icon: { path: google.maps.SymbolPath.CIRCLE, scale: 6, fillColor: "#ff0000", fillOpacity: 1, strokeColor: "#ffffff", strokeWeight: 2 } });
      } else { userMarker.setPosition(pos); }

      if (!accuracyCircle) {
        accuracyCircle = new google.maps.Circle({ map, center: pos, radius: accuracy, fillColor: "#1a73e8", fillOpacity: 0.15, strokeColor: "#1a73e8", strokeOpacity: 0.4, strokeWeight: 1, clickable: false });
      } else { accuracyCircle.setCenter(pos); accuracyCircle.setRadius(accuracy); }

      updateRouteProgress();

      const d = google.maps.geometry.spherical.computeDistanceBetween(userLatLng, new google.maps.LatLng(LUKANG_CENTER));
      if(!entered && d <= LUKANG_RADIUS){
        entered = true; startTimer(); map.panTo(pos); map.setZoom(16);
        setStatus("已進入鹿港區域，開始計時");
      }
    },
    null, { enableHighAccuracy: true, maximumAge: 0, timeout: 4500 }
  );
}

function updateRouteProgress() {
  if (!remainingRoute || !passedRoute || !userLatLng) return;
  const fullPath = remainingRoute.getPath().getArray();
  if (fullPath.length === 0) return;

  let closestIndex = 0; let minDist = Infinity;
  fullPath.forEach((point, i) => {
    const dist = google.maps.geometry.spherical.computeDistanceBetween(userLatLng, point);
    if (dist < minDist) { minDist = dist; closestIndex = i; }
  });

  closestIndex = Math.max(closestIndex, lastClosestIndex);
  lastClosestIndex = closestIndex;
  passedRoute.setPath(fullPath.slice(0, closestIndex + 1));
  remainingRoute.setPath(fullPath.slice(closestIndex));
  if (fullPath.length - closestIndex < 3) setStatus("已抵達目的地");
}

/* 其他功能 */
async function requestWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} }
function releaseWakeLock() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }
function startTimer(){ if(timerId) return; timerStart=Date.now(); timerId=setInterval(()=>{ const s=Math.floor((Date.now()-timerStart)/1000); const h=String(Math.floor(s/3600)).padStart(2,"0"); const m=String(Math.floor(s%3600/60)).padStart(2,"0"); const ss=String(s%60).padStart(2,"0"); document.getElementById("timer").textContent=`${h}:${m}:${ss}`; },1000); }
function toggleFullscreen(){ const mapDiv=document.getElementById("map"); const btn=document.querySelector(".full-btn"); if(!isFullscreen){ originalHeight=mapDiv.offsetHeight; const uiHeight=document.getElementById("uiBar").offsetHeight; mapDiv.style.height=(window.innerHeight-uiHeight)+"px"; mapDiv.style.minHeight=mapDiv.style.height; btn.textContent="返回"; isFullscreen=true; }else{ mapDiv.style.height=originalHeight+"px"; mapDiv.style.minHeight=originalHeight+"px"; btn.textContent="全螢幕地圖"; isFullscreen=false; } setTimeout(()=>google.maps.event.trigger(map,"resize"),300); }
function skipGeolocation(){ setStatus("未啟用定位（僅瀏覽）"); }
function finishTrip(){ if(!timerStart || uploaded) return; clearInterval(timerId); finalSeconds = Math.floor((Date.now() - timerStart) / 1000); uploaded = true; uploadResult(); setStatus("行程完成，時間已上傳 "); releaseWakeLock(); if(autoUpdateInterval) clearInterval(autoUpdateInterval); }
function uploadResult(){ fetch("https://script.google.com/macros/s/AKfycbwyfOZCtoaouSGLlvQ4c46uGUMxcNrQ03ibIadG6U4BLo4aWcFBpkBy4WWEBYNVymmkmw/exec",{ method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ time: document.getElementById("timer").textContent, seconds: finalSeconds }) }); }

window.onload=initMap;
</script>
</body>
</html>
